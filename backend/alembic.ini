# Alembic configuration for FoodHeroes. Run alembic from the backend/ folder.
#
# There is deliberately no database URL in this file. The target database
# comes from the DATABASE_URL environment variable, and alembic refuses to run
# without it, so a migration can never hit a database by accident:
#
#     DATABASE_URL=sqlite:////tmp/fh-fresh.db alembic upgrade head
#
# Before migrating a database that holds real data, follow
# docs/DATABASE_RECOVERY.md (stop the app, preflight, verified backup).

[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
